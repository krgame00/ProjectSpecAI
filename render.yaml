services:
  - type: web
    name: pcspec-backend
    runtime: node
    rootDir: node-backend
    plan: free
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://project-spec-ai.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: smart_pc_builder
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false