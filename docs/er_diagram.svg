  <rect x="650" y="280" width="40" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="657" y="294" font-size="11" font-weight="700" fill="#000000">1 : N</text>

  <!-- products -> spec_cpu -->
